apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: latestagentdemo-kagent
spec:
  description: Dice-rolling sample ADK-Python agent.
  source:
    image: us-docker.pkg.dev/developers-369321/agentregistry-enterprise-dev/dev-walkthrough/latest/agentdemo:v2026.8.0
    repository:
      url: https://github.com/solo-io/agentregistry-dev-samples.git
      branch: walkthrough-latest
      subfolder: latestagentdemo
  mcpServers:
    - kind: MCPServer
      name: test-mcp-server
    - kind: MCPServer
      name: latest-arctl-init-http-container
    - kind: MCPServer
      name: latest-arctl-init-stdio
    - kind: MCPServer
      name: latest-published-stdio-oci
    - kind: MCPServer
      name: latest-published-stdio-npm
    - kind: MCPServer
      name: latest-published-stdio-pypi
  modelProvider: bedrock
  modelName: us.anthropic.claude-sonnet-4-6
